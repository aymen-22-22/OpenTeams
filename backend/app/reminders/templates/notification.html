{% extends "base.html" %}
{% block content %}
{% if intro %}<p style="margin:0 0 16px;color:#525252;white-space:pre-line;">{{ intro }}</p>{% endif %}
<h1 style="margin:0 0 12px;font-size:20px;color:#171717;" dir="auto">{{ title }}</h1>
{% if body %}<p style="margin:0 0 20px;white-space:pre-line;" dir="auto">{{ body }}</p>{% endif %}
<table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:6px;background:{{ brand.color }};">
  <a href="{{ link_url }}" style="display:inline-block;padding:12px 20px;color:{{ brand.on_color }};text-decoration:none;font-weight:bold;">{{ t.open }}</a>
</td></tr></table>
{% endblock %}
