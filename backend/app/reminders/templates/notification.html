{% extends "base.html" %}
{% block content %}
<h1 style="margin:0 0 12px;font-size:20px;color:#171717;">{{ title }}</h1>
{% if body %}<p style="margin:0 0 20px;white-space:pre-line;">{{ body }}</p>{% endif %}
<table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:6px;background:#0F766E;">
  <a href="{{ link_url }}" style="display:inline-block;padding:12px 20px;color:#ffffff;text-decoration:none;font-weight:bold;">{{ t.open }}</a>
</td></tr></table>
{% endblock %}
