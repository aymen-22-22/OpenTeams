<!doctype html>
<html>
<body style="margin:0;padding:24px;background:#f5f5f5;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:auto;background:#ffffff;border-radius:8px;">
    <tr><td style="background:{{brand_color}};color:{{on_color}};padding:16px 24px;font-size:18px;font-weight:bold;">
      <img src="{{logo_url}}" alt="" height="32" style="vertical-align:middle;"> {{brand_name}}
    </td></tr>
    <tr><td style="padding:24px;color:#171717;font-size:15px;line-height:1.5;">
      <p style="color:#525252;">{{intro}}</p>
      <h1 style="font-size:20px;">{{title}}</h1>
      <p>{{body}}</p>
      {{items}}
      <p><a href="{{link}}" style="background:{{brand_color}};color:{{on_color}};padding:12px 20px;border-radius:6px;text-decoration:none;font-weight:bold;">Ouvrir</a></p>
    </td></tr>
    <tr><td style="padding:16px 24px;border-top:1px solid #e5e5e5;color:#525252;font-size:12px;">
      <a href="{{preferences_url}}" style="color:{{brand_color}};">Gérer mes notifications</a>
    </td></tr>
  </table>
</body>
</html>
