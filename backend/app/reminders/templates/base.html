<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Segoe UI,Arial,'Noto Sans Arabic',sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;">
<tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;overflow:hidden;">
    <tr><td style="background:#0F766E;padding:16px 24px;color:#ffffff;font-size:18px;font-weight:bold;text-align:{{ start }};">OpenTeams</td></tr>
    <tr><td style="padding:24px;color:#171717;font-size:15px;line-height:1.5;text-align:{{ start }};">
      {% block content %}{% endblock %}
    </td></tr>
    <tr><td style="padding:16px 24px;border-top:1px solid #e5e5e5;color:#525252;font-size:12px;text-align:{{ start }};">
      {{ t.footer }} <a href="{{ preferences_url }}" style="color:#0F766E;">{{ t.preferences }}</a>
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
